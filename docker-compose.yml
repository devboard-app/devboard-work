services:
  devboard-work:
    build:
      context: .
    container_name: devboard-work
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_URL: redis://devboard-redis:6379/0
    ports:
      - "8004:8000"
    networks:
      - devboard-network

networks:
  devboard-network:
    external: true
