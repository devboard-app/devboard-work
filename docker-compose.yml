# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard

services:
  devboard-work:
    build:
      context: .
    container_name: devboard-work
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_URL: redis://devboard-redis:6379/0
    ports:
      - "8004:8000"
    networks:
      - devboard-network

  devboard-work-outbox-relay:
    build:
      context: .
    container_name: devboard-work-outbox-relay
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_URL: redis://devboard-redis:6379/0
    command: python manage.py drain_outbox
    networks:
      - devboard-network

networks:
  devboard-network:
    name: devboard-network
    external: true